<!-- Sprout: a little solarpunk seedling-spirit.
     The groups are named so the stage can animate them (swing the arms, bob the body,
     glow the leaf). Nothing here is magic — it is just shapes. Open it and poke at it. -->
<svg id="sprout" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sprout, a seedling spirit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sprout-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffe6a3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe6a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sprout-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd18a"/>
      <stop offset="100%" stop-color="#5aa769"/>
    </linearGradient>
    <linearGradient id="sprout-leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6cc07a"/>
      <stop offset="100%" stop-color="#b7e98f"/>
    </linearGradient>
  </defs>

  <!-- the warm glow it gives off when concentrating; the stage fades this in and out -->
  <circle id="sprout-aura" cx="60" cy="58" r="52" fill="url(#sprout-glow)" opacity="0"/>

  <!-- a curling sprout on its head, with a glowing bud at the tip -->
  <g id="sprout-sprout">
    <path d="M60 36 C60 18 46 14 44 2" fill="none" stroke="#4f9a5f" stroke-width="5" stroke-linecap="round"/>
    <path id="sprout-leaf-a" d="M44 4 C33 -2 24 6 28 16 C40 18 46 12 44 4 Z" fill="url(#sprout-leaf)"/>
    <circle id="sprout-bud" cx="44" cy="3" r="5" fill="#ffd36b"/>
  </g>

  <!-- arms: each is its own group rotating about the shoulder, so the stage can swing them -->
  <g id="sprout-arm-l" style="transform-origin:38px 74px">
    <path d="M38 74 C24 76 16 86 14 98" fill="none" stroke="#54a064" stroke-width="7" stroke-linecap="round"/>
    <circle cx="14" cy="99" r="5" fill="#67b877"/>
  </g>
  <g id="sprout-arm-r" style="transform-origin:82px 74px">
    <path d="M82 74 C96 76 104 86 106 98" fill="none" stroke="#54a064" stroke-width="7" stroke-linecap="round"/>
    <circle cx="106" cy="99" r="5" fill="#67b877"/>
  </g>

  <!-- the round mossy body -->
  <g id="sprout-body">
    <ellipse cx="60" cy="82" rx="34" ry="36" fill="url(#sprout-body)"/>
    <ellipse cx="60" cy="82" rx="34" ry="36" fill="none" stroke="#3f8451" stroke-width="2" opacity="0.5"/>
    <!-- little moss freckles -->
    <circle cx="44" cy="96" r="2.4" fill="#cdeeb0" opacity="0.8"/>
    <circle cx="74" cy="92" r="2" fill="#cdeeb0" opacity="0.7"/>
    <circle cx="64" cy="104" r="1.8" fill="#cdeeb0" opacity="0.6"/>
  </g>

  <!-- face: two eyes that the stage can turn into ^^ when happy, and a small smile -->
  <g id="sprout-face">
    <g id="sprout-eyes">
      <circle cx="49" cy="78" r="4.4" fill="#2b3a2e"/>
      <circle cx="71" cy="78" r="4.4" fill="#2b3a2e"/>
      <circle cx="50.4" cy="76.6" r="1.4" fill="#fff"/>
      <circle cx="72.4" cy="76.6" r="1.4" fill="#fff"/>
    </g>
    <path id="sprout-mouth" d="M53 90 Q60 95 67 90" fill="none" stroke="#2b3a2e" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="42" cy="88" r="4" fill="#f4a0a0" opacity="0.55"/>
    <circle cx="78" cy="88" r="4" fill="#f4a0a0" opacity="0.55"/>
  </g>

  <!-- two little root-feet -->
  <g id="sprout-feet">
    <path d="M50 116 C48 124 44 126 46 132" fill="none" stroke="#4f9a5f" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 116 C72 124 76 126 74 132" fill="none" stroke="#4f9a5f" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
